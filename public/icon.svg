<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="psGradientLight" x1="44" y1="40" x2="138" y2="138" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6B63FF" />
      <stop offset="1" stop-color="#C86AE6" />
    </linearGradient>
    <linearGradient id="psGradientDark" x1="44" y1="40" x2="138" y2="138" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" />
      <stop offset="1" stop-color="#F0ABFC" />
    </linearGradient>
    <pattern id="gridLight" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" stroke="#DDD7FF" stroke-opacity="0.55" stroke-width="1"/>
    </pattern>
    <pattern id="gridDark" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" stroke="#2A3550" stroke-opacity="0.75" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    @media (prefers-color-scheme: light) {
      .bg { fill: #F7F5FF; }
      .border { stroke: #E4DEFF; }
      .grid { fill: url(#gridLight); opacity: 1; }
      .ps { fill: url(#psGradientLight); }
      .accent-line { stroke: #A7B8FF; }
      .accent-dot { fill: #8B7FFF; }
    }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #111827; }
      .border { stroke: #243041; }
      .grid { fill: url(#gridDark); opacity: 1; }
      .ps { fill: url(#psGradientDark); }
      .accent-line { stroke: #67D5FF; }
      .accent-dot { fill: #A78BFA; }
    }
  </style>

  <rect class="bg" x="1.5" y="1.5" width="177" height="177" rx="40" />
  <rect class="border" x="1.5" y="1.5" width="177" height="177" rx="40" stroke-width="3" />
  <rect class="grid" x="18" y="18" width="144" height="144" rx="28" />

  <text
    x="50%"
    y="50%"
    text-anchor="middle"
    dominant-baseline="middle"
    class="ps"
    font-family="'Segoe UI', 'Inter', sans-serif"
    font-size="78"
    font-weight="800"
    letter-spacing="-5"
  >
    PS
  </text>

  <path class="accent-line" d="M53 127H127" stroke-width="8" stroke-linecap="round" />
  <circle class="accent-dot" cx="137" cy="50" r="6" />
</svg>
